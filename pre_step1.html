<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Route — 사전질문 1/5</title>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
  <link rel="stylesheet" href="pre_step.css">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Route">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#F9F9F9">
</head>
<body>
  <div class="screen">

    <!-- 배경 이미지 -->
    <img src="images/pre_bg.svg" alt="" class="pre-bg">

    <!-- 페이지 래퍼 -->
    <div class="pre-wrap">

      <!-- 헤더: 배경 없음, pre-main 밖 -->
      <header class="pre-header">
        <a href="#" onclick="history.back(); return false;" class="btn-back">
          <img src="images/pre_header.svg" alt="뒤로가기" class="btn-back-img">
        </a>
      </header>

      <!-- 메인 (backdrop-filter) -->
      <div class="pre-main">

        <!-- 콘텐츠 -->
        <div class="pre-contents">

          <!-- 상단: 프로그레스 + 질문 -->
          <div class="pre-top">

            <!-- 프로그레스바 -->
            <div class="progressbar">
              <span class="step-label">STEP 01 / 05</span>
              <div class="progress-track">
                <div class="progress-fill" style="width: 20%"></div>
              </div>
            </div>

            <!-- 질문 카드 -->
            <div class="question-card">
              <p class="question-title">현재 디자인 경험은 어느 정도인가요?</p>
              <p class="question-sub">맞춤형 커리큘럼을 추천해드려요.</p>
            </div>

          </div>

          <!-- 선택지 리스트 -->
          <div class="option-list">

            <div class="option-item" onclick="selectOption(this)">
              <span class="option-text">비전공자 / 입문자</span>
              <img src="images/pre_radio_empty.svg" alt="" class="option-radio">
            </div>

            <div class="option-item" onclick="selectOption(this)">
              <span class="option-text">유관 직군 전향</span>
              <img src="images/pre_radio_empty.svg" alt="" class="option-radio">
            </div>

            <div class="option-item option-item--selected" onclick="selectOption(this)">
              <span class="option-text">주니어 디자이너</span>
              <img src="images/pre_radio_selected.svg" alt="" class="option-radio">
            </div>

            <div class="option-item" onclick="selectOption(this)">
              <span class="option-text">독학 중</span>
              <img src="images/pre_radio_empty.svg" alt="" class="option-radio">
            </div>

          </div>

        </div><!-- /pre-contents -->
      </div><!-- /pre-main -->


      <!-- 다음 버튼 -->
      <a href="pre_step2" class="btn-next">
        <span class="btn-next-text">다음으로</span>
        <img src="images/pre_btn_next.svg" alt="" class="btn-next-icon">
      </a>

    </div><!-- /pre-wrap -->
  </div>

  <script>
    function selectOption(el) {
      // 모든 선택 해제
      document.querySelectorAll('.option-item').forEach(item => {
        item.classList.remove('option-item--selected');
        item.querySelector('.option-radio').src = 'images/pre_radio_empty.svg';
      });
      // 선택 적용
      el.classList.add('option-item--selected');
      el.querySelector('.option-radio').src = 'images/pre_radio_selected.svg';
    }
  </script>
</body>
</html>
