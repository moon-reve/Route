<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Route</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="splash.css">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Route">
  <link rel="icon" href="images/home_logo_icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#F9F9F9">
  <!-- Open Graph -->
  <meta property="og:title" content="Route — 나만의 커리어 항로">
  <meta property="og:description" content="AI가 설계하는 맞춤형 12주 커리어 루트. 목표·스킬·시간에 맞게 항로를 그려보세요.">
  <meta property="og:image" content="https://route-six-sooty.vercel.app/images/rout_og_image.png">
  <meta property="og:url" content="https://route-six-sooty.vercel.app/">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
</head>
<body>
  <div class="screen">
    <img class="bg" src="images/splash_bg.svg" alt="">

    <div class="title-box">
      <div class="logo">
        <img src="images/splash_logo.svg" alt="Route Logo">
        <span class="logo-text">Route</span>
      </div>

      <img class="divider" src="images/splash_line.svg" alt="">

      <p class="tagline">멈춰있는 커리어를 움직이는<br>실행의 궤적 : 루트</p>
    </div>
  </div>
  <script>
    function goLogin() {
      window.location.href = 'onboarding1';
    }

    // 5000ms 후 자동 이동
    var timer = setTimeout(goLogin, 5000);

    // 터치 / 클릭 시 즉시 이동
    document.querySelector('.screen').addEventListener('click', function() {
      clearTimeout(timer);
      goLogin();
    });
  </script>
</body>
</html>
