<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Route — 온보딩</title>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
  <link rel="stylesheet" href="onboarding.css">
</head>
<body>
  <div class="screen">

    <!-- 슬라이드 레이어: 배경 + 텍스트 -->
    <div class="slide-layer">
      <img class="ob-bg" src="images/onboarding2_bg.svg" alt="">
      <div class="ob-content">
        <div class="title">
          <span class="title-sub">내 목표에 맞는 미션만 쏙쏙</span>
          <span class="title-main">내 페이스대로!</span>
        </div>
        <img class="ob-line" src="images/onboarding_line.svg" alt="">
        <div class="body-text">
          <p>거창한 계획은 내려놓으세요. 당장 오늘 실천할 수 있는</p>
          <p>작은 미션들을 하나씩 달성하며 나만의 길을 만들어가요.</p>
        </div>
      </div>
    </div>

    <!-- 하단 컨트롤: 고정 (애니메이션 없음) -->
    <div class="bottom-controls">
      <a href="login.html" class="skip-btn">SKIP</a>
      <div class="dots">
        <span class="dot"></span>
        <span class="dot dot--active"></span>
        <span class="dot"></span>
      </div>
      <a href="onboarding3.html" class="next-btn">
        <img src="images/onboarding_next_btn.svg" alt="다음">
      </a>
    </div>

  </div>
</body>
</html>
