<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Route</title>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="my_page.css">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Route">
  <link rel="icon" href="images/home_logo_icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#F9F9F9">
</head>
<body data-page="my">
  <div class="screen">
    <div class="scroll-area">
      <div class="my-page">
        <main class="main">

          <!-- 헤더: 타이틀만 중앙 -->
          <header class="header">
            <div class="header-title">마이페이지</div>
          </header>

          <!-- 프로필 섹션 -->
          <section class="section-profile">
            <img src="images/my_profile_photo.svg" alt="프로필 사진" class="profile-photo">
            <p class="profile-name">김루트</p>
            <p class="profile-bio">3년차 UX 디자이너 | 피그마 마스터 항해 중</p>
            <button class="edit-btn">프로필 수정</button>
          </section>

          <!-- 성취 섹션 -->
          <section class="section-mastery">
            <div class="mastery-box">
              <!-- 배경 별자리 일러스트 -->
              <img src="images/my_mastery_bg.svg" alt="" class="mastery-bg">

              <div class="mastery-title-group">
                <p class="mastery-sub">지금까지 밝힌 성좌</p>
                <p class="mastery-main">총 14개의 미션 완료</p>
              </div>

              <!-- 프로그레스 바 -->
              <div class="progress-wrapper">
                <div class="progress-track">
                  <div class="progress-fill"></div>
                </div>
                <div class="progress-dot"></div>
              </div>

              <p class="mastery-caption">전체 목표의 60%를 달성했어요</p>
            </div>
          </section>

          <!-- 메뉴 섹션 -->
          <section class="section-menu">
            <div class="menu-item menu-item--first">
              <span class="menu-text">관심 직무 및 목표 설정</span>
              <img src="images/my_chevron_right.svg" alt="" class="menu-arrow">
            </div>
            <div class="menu-item">
              <span class="menu-text">알림 설정</span>
              <img src="images/my_chevron_right.svg" alt="" class="menu-arrow">
            </div>
            <div class="menu-item">
              <span class="menu-text">계정 관리</span>
              <img src="images/my_chevron_right.svg" alt="" class="menu-arrow">
            </div>
            <div class="menu-item">
              <span class="menu-text">앱 정보 및 고객센터</span>
              <img src="images/my_chevron_right.svg" alt="" class="menu-arrow">
            </div>
          </section>

        </main>
      </div>
    </div>


    <div id="nav-root"></div>
  </div>
  <script src="common.js"></script>
</body>
</html>
