  <text x="80" y="240" font-size="58" font-weight="800" fill="#1A1C1E" letter-spacing="-0.02em">당신의 커리어,</text>
  <text x="80" y="312" font-size="58" font-weight="800" fill="#1A1C1E" letter-spacing="-0.02em">아직 그려지지 않은</text>
  <text x="80" y="384" font-size="58" font-weight="800" fill="#E8941A" letter-spacing="-0.02em">별자리입니다.</text>

