  <!-- Route logo + name -->
  <!-- Logo icon (rounded square) -->
  <rect x="80" y="504" width="40" height="40" rx="10" fill="#1A1C1E"/>
  <text x="100" y="531" text-anchor="middle" font-size="18" font-weight="800" fill="#E8941A">R</text>

