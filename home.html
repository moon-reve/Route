<body>

  <div class="screen">

    <!-- 스크롤 영역 -->

      <main class="home-main">

        <!-- 탑 헤더 (로고 + 알림) -->

        <div class="contents">

          <!-- ① 히어로 + 칩 묶음 -->
          <div class="section-top">
            <section class="section-hero">
              <div class="hero-card">
                <img class="hero-bg" src="images/home_hero_bg.svg" alt="">

                </div>
                <a href="#" class="hero-btn">항로 시작하기 →</a>
              </div>
            </section>

            <!-- ② 필터 칩 -->

              <button class="chip chip--active">전체</button>
              <button class="chip">디자인</button>
              <button class="chip">개발</button>
              <button class="chip">기획</button>
              <button class="chip">마케팅</button>
            </section>
          </div>

          <!-- ③ 카드 슬라이드 -->
          <section class="section-cards">
            <h2 class="section-title">새로운 항로를 위한 나침반</h2>
            <div class="card-list">

              <a href="detail_card1" class="card">
                <div class="card-img-box">
                  <img src="images/home_card1_img.svg" alt="">
                </div>
                <div class="card-text-box">
                  <span class="card-title">헷갈리는 UI/UX 필수 용어</span>
                </div>
              </a>

              <div class="card">
                <div class="card-img-box">
                  <img src="images/home_card2_img.svg" alt="">
                </div>
                <div class="card-text-box">
                  <span class="card-title">디자인 시스템 기초 가이드</span>
                </div>
              </div>

              <div class="card">
                <div class="card-img-box">
                  <img src="images/home_card3_img.svg" alt="">
                </div>
                <div class="card-text-box">
                  <span class="card-title">디자인 시스템 기초 가이드</span>
                </div>
              </div>

            </div>
          </section>

          <!-- ④ 아티클 리스트 -->
          <section class="section-articles">
            <h2 class="section-title">앞서간 별들의 궤적</h2>

            <div class="article-item">
              <img class="article-img" src="images/home_article1_img.svg" alt="">
              <div class="article-text">
                <p class="article-title">비전공자에서 네카라쿠배 디자이너로 합격한 포트폴리오 분석</p>
                <p class="article-meta">디자인 트렌드 • 2024.10.15</p>
              </div>
            </div>

            <a href="detail_magazine1" class="article-item">
              <img class="article-img" src="images/home_article2_img.svg" alt="">
              <div class="article-text">
                <p class="article-title">실무에서 바로 쓰는 피그마 오토레이아웃 활용 팁 10가지</p>
                <p class="article-meta">툴 가이드 • 2024.10.12</p>
              </div>
            </a>

            <div class="article-item">
              <img class="article-img" src="images/home_article3_img.svg" alt="">
              <div class="article-text">
                <p class="article-title">생성형 AI 시대, 디자이너는 어떤 경쟁력을 갖춰야 하는가</p>
                <p class="article-meta">인사이트 • 2024.10.10</p>
              </div>
            </div>

          </section>

        </div><!-- /contents -->
      </main>
    </div><!-- /scroll-area -->

    <!-- 네비게이션 바 -->
    <nav class="nav-bar">
      <a href="home" class="nav-tab nav-tab--active">
        <img src="images/nav_home.svg" alt="Home">
        <span>Home</span>
      </a>
      <a href="roadmap" class="nav-tab">
        <img src="images/nav_route.svg" alt="Route">
        <span>Route</span>
      </a>
      <a href="log_write" class="nav-center">
        <img src="images/nav_center.svg" alt="">
      </a>
      <a href="log_calendar" class="nav-tab">

        <span>Log</span>
      </a>
      <a href="my_page" class="nav-tab">
        <img src="images/nav_my.svg" alt="My">
        <span>My</span>
      </a>
    </nav>

  </div>

  <script>
    // 카드 리스트 마우스/터치 드래그 스크롤
    const cardList = document.querySelector('.card-list');
    let isDown = false;
    let startX;
    let scrollLeft;

    cardList.addEventListener('mousedown', (e) => {
      isDown = true;
      cardList.classList.add('is-dragging');
      startX = e.pageX - cardList.offsetLeft;
      scrollLeft = cardList.scrollLeft;
    });

    cardList.addEventListener('mouseleave', () => {
      isDown = false;
      cardList.classList.remove('is-dragging');
    });

    cardList.addEventListener('mouseup', () => {
      isDown = false;
      cardList.classList.remove('is-dragging');
    });

    cardList.addEventListener('mousemove', (e) => {
      if (!isDown) return;
      e.preventDefault();
      const x = e.pageX - cardList.offsetLeft;
      const walk = (x - startX) * 1.5;
      cardList.scrollLeft = scrollLeft - walk;
    });
  </script>
</body>
</html>
