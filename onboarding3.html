<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Route</title>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="onboarding.css">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Route">
  <link rel="icon" href="images/home_logo_icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#F9F9F9">
</head>
<body>
  <div class="screen">

    <!-- 슬라이드 레이어: 배경 + 텍스트 -->
    <div class="slide-layer">
      <img class="ob-bg" src="images/onboarding3_bg.svg" alt="">
      <div class="ob-content">
        <div class="title title--w236">
          <span class="title-main">눈에 보이는 나의 성장</span>
          <span class="title-sub">루트가 끝까지 응원할게요!</span>
        </div>
        <img class="ob-line" src="images/onboarding_line.svg" alt="">
        <div class="body-text">
          <p>매일 쌓여가는 기록을 보며 자신감을 채워보세요.</p>
          <p>루트와 함께 당신만의 항로를 탐색할 준비가 되셨나요?</p>
        </div>
      </div>
    </div>

    <!-- 하단 컨트롤: CTA 버튼만 (오른쪽에서 왼쪽으로 확장) -->
    <div class="bottom-controls bottom-controls--ob3">
      <button data-href="login" class="cta-btn">나만의 길 찾기 시작하기 →</button>
    </div>

  </div>
  <script src="common.js"></script>
</body>
</html>
