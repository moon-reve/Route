<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Route — 온보딩</title>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
  <link rel="stylesheet" href="onboarding.css">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Route">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
</head>
<body>
  <div class="screen">

    <!-- 슬라이드 레이어: 배경 + 텍스트 (오른쪽에서 왼쪽으로 슬라이드 인) -->
    <div class="slide-layer slide-layer--static">
      <img class="ob-bg" src="images/onboarding1_bg.svg" alt="">
      <div class="ob-content">
        <div class="title">
          <span class="title-sub">혼자 하는 이직 준비</span>
          <span class="title-main">많이 막막하셨죠?</span>
        </div>
        <img class="ob-line" src="images/onboarding_line.svg" alt="">
        <div class="body-text">
          <p>어디서부터 어떻게 시작해야 할지 몰라도 괜찮아요.</p>
          <p>루트가 당신에게 딱 맞는 길을 차근차근 안내해 드릴게요.</p>
        </div>
      </div>
    </div>

    <!-- 하단 컨트롤: 고정 (애니메이션 없음) -->
    <div class="bottom-controls">
      <a href="login" class="skip-btn">SKIP</a>
      <div class="dots">
        <span class="dot dot--active"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
      <a href="onboarding2" class="next-btn">
        <img src="images/onboarding_next_btn.svg" alt="다음">
      </a>
    </div>

  </div>
</body>
</html>
