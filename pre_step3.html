<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Route — 사전질문 3/5</title>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
  <link rel="stylesheet" href="pre_step.css">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Route">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#F9F9F9">
</head>
<body>
  <div class="screen">

    <!-- 배경 이미지 -->
    <img src="images/pre_bg.svg" alt="" class="pre-bg">

    <!-- 페이지 래퍼 -->
    <div class="pre-wrap">

      <!-- 메인 -->
      <div class="pre-main">

        <!-- 헤더 -->
        <header class="pre-header">
          <a href="pre_step2" class="btn-back">
            <img src="images/pre_header.svg" alt="뒤로가기" class="btn-back-img">
          </a>
        </header>

        <!-- 콘텐츠 -->
        <div class="pre-contents">

          <!-- 상단: 프로그레스 + 질문 -->
          <div class="pre-top">

            <!-- 프로그레스바 -->
            <div class="progressbar">
              <span class="step-label">STEP 03 / 05</span>
              <div class="progress-track">
                <div class="progress-fill" style="width: 60%"></div>
              </div>
            </div>

            <!-- 질문 카드 -->
            <div class="question-card">
              <p class="question-title">어떤 디자이너로 성장하고 싶으신가요?</p>
              <p class="question-sub">지향하시는 커리어 방향을 선택해주세요.</p>
            </div>

          </div>

          <!-- 선택지 리스트 -->
          <div class="option-list">

            <div class="option-item" onclick="selectOption(this)">
              <span class="option-text">UI 중심</span>
              <img src="images/pre_radio_empty.svg" alt="" class="option-radio">
            </div>

            <div class="option-item" onclick="selectOption(this)">
              <span class="option-text">UX 기획 중심</span>
              <img src="images/pre_radio_empty.svg" alt="" class="option-radio">
            </div>

            <div class="option-item" onclick="selectOption(this)">
              <span class="option-text">BX 중심</span>
              <img src="images/pre_radio_empty.svg" alt="" class="option-radio">
            </div>

            <div class="option-item" onclick="selectOption(this)">
              <span class="option-text">Generalist</span>
              <img src="images/pre_radio_empty.svg" alt="" class="option-radio">
            </div>

          </div>

        </div><!-- /pre-contents -->
      </div><!-- /pre-main -->

      <!-- 다음 버튼 -->
      <a href="pre_step4" class="btn-next">
        <span class="btn-next-text">다음으로</span>
        <img src="images/pre_btn_next.svg" alt="" class="btn-next-icon">
      </a>

    </div><!-- /pre-wrap -->
  </div>

  <script>
    function selectOption(el) {
      const isSelected = el.classList.contains('option-item--selected');
      // 모든 선택 해제
      document.querySelectorAll('.option-item').forEach(item => {
        item.classList.remove('option-item--selected');
        item.querySelector('.option-radio').src = 'images/pre_radio_empty.svg';
      });
      // 이미 선택된 항목 클릭 시 → 선택 취소 (toggle)
      if (!isSelected) {
        el.classList.add('option-item--selected');
        el.querySelector('.option-radio').src = 'images/pre_radio_selected.svg';
      }
    }
  </script>
</body>
</html>
