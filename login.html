<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Route</title>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="login.css">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Route">
  <link rel="icon" href="images/home_logo_icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#F9F9F9">
</head>
<body>

  <div class="screen">
    <!-- 배경 -->
    <img class="login-bg" src="images/login_bg.svg" alt="">

    <!-- 메인 콘텐츠 -->
    <main class="main">

      <!-- 헤더 섹션 -->
      <section class="header-section">
        <div class="logo-row">
          <img src="images/login_logo.svg" alt="Route 로고" class="logo-img">
          <span class="logo-text">Route</span>
        </div>
        <h1 class="heading">새로운 커리어를<br>찾아보세요</h1>
        <p class="subtext">개인화된 성장 구조와 구조적 통찰력을 확인하세요.</p>
      </section>

      <!-- 액션 섹션 -->
      <section class="action-section">
        <button class="btn btn-kakao" data-href="home">
          <img src="images/ic_kakao.svg" alt="" class="btn-icon">
          <span>카카오톡으로 로그인</span>
        </button>

        <button class="btn btn-google" data-href="home">
          <img src="images/ic_google.svg" alt="" class="btn-icon">
          <span>구글로 로그인</span>
        </button>

        <div class="footer-link">
          <button class="link-btn" id="open-modal">다른 방법으로 로그인</button>
        </div>
      </section>
    </main>

    <!-- 오버레이 -->
    <div class="overlay" id="overlay"></div>

    <!-- 로그인 모달 -->
    <div class="modal" id="modal">
      <div class="modal-handle"></div>

      <h2 class="modal-title">다른 방법으로 로그인</h2>

      <div class="modal-buttons">
        <button class="btn btn-line" data-href="home">
          <img src="images/ic_line.svg" alt="" class="btn-icon">
          <span>LINE으로 로그인</span>
        </button>

        <button class="btn btn-linkedin" data-href="home">
          <img src="images/ic_linkedin.svg" alt="" class="btn-icon">
          <span>LinkedIn으로 로그인</span>
        </button>

        <button class="btn btn-github" data-href="home">
          <img src="images/ic_github.svg" alt="" class="btn-icon">
          <span>GitHub로 로그인</span>
        </button>

        <button class="btn btn-phone" data-href="home">
          <img src="images/ic_phone.svg" alt="" class="btn-icon">
          <span>휴대폰/이메일로 로그인</span>
        </button>
      </div>

      <div class="guest-section">
        <button class="guest-btn" data-href="home">비회원으로 둘러보기</button>
      </div>
    </div>
  </div>

  <script src="login.js"></script>
  <script src="common.js"></script>
</body>
</html>
