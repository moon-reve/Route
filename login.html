<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Route — 로그인</title>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
  <link rel="stylesheet" href="login.css">
</head>
<body>

  <div class="screen">
    <!-- 배경 -->
    <img class="login-bg" src="images/login_bg.svg" alt="">

    <!-- 메인 콘텐츠 -->
    <main class="main">

      <!-- 헤더 섹션 -->
      <section class="header-section">
        <div class="logo-row">
          <img src="images/login_logo.svg" alt="Route 로고" class="logo-img">
          <span class="logo-text">Route</span>
        </div>
        <h1 class="heading">새로운 커리어를<br>찾아보세요</h1>
        <p class="subtext">개인화된 성장 구조와 구조적 통찰력을 확인하세요.</p>
      </section>

      <!-- 액션 섹션 -->
      <section class="action-section">
        <button class="btn btn-kakao" onclick="location.href='home'">
          <img src="images/ic_kakao.svg" alt="" class="btn-icon">
          <span>카카오톡으로 로그인</span>
        </button>

        <button class="btn btn-google" onclick="location.href='home'">
          <img src="images/ic_google.svg" alt="" class="btn-icon">
          <span>구글로 로그인</span>
        </button>

        <div class="footer-link">
          <button class="link-btn" id="open-modal">다른 방법으로 로그인</button>
        </div>
      </section>
    </main>

    <!-- 오버레이 -->
    <div class="overlay" id="overlay"></div>

    <!-- 로그인 모달 -->
    <div class="modal" id="modal">
      <div class="modal-handle"></div>

      <h2 class="modal-title">다른 방법으로 로그인</h2>

      <div class="modal-buttons">
        <button class="btn btn-line" onclick="location.href='home'">
          <img src="images/ic_line.svg" alt="" class="btn-icon">
          <span>LINE으로 로그인</span>
        </button>

        <button class="btn btn-linkedin" onclick="location.href='home'">
          <img src="images/ic_linkedin.svg" alt="" class="btn-icon">
          <span>LinkedIn으로 로그인</span>
        </button>

        <button class="btn btn-github" onclick="location.href='home'">
          <img src="images/ic_github.svg" alt="" class="btn-icon">
          <span>GitHub로 로그인</span>
        </button>

        <button class="btn btn-phone" onclick="location.href='home'">
          <img src="images/ic_phone.svg" alt="" class="btn-icon">
          <span>휴대폰/이메일로 로그인</span>
        </button>
      </div>

      <div class="guest-section">
        <button class="guest-btn" onclick="location.href='home'">비회원으로 둘러보기</button>
      </div>
    </div>
  </div>

  <script>
    const openBtn = document.getElementById('open-modal');
    const overlay = document.getElementById('overlay');
    const modal   = document.getElementById('modal');

    function openModal() {
      overlay.classList.add('active');
      modal.classList.add('active');
    }

    function closeModal() {
      overlay.classList.remove('active');
      modal.classList.remove('active');
    }

    openBtn.addEventListener('click', openModal);
    overlay.addEventListener('click', closeModal);
  </script>
</body>
</html>
