<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Route</title>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="daily_mission.css">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Route">
  <link rel="icon" href="images/home_logo_icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#F9F9F9">
</head>
<body data-page="">
  <div class="screen">
    <div class="scroll-area">
      <div class="daily-container">
        <main class="main">

          <!-- 헤더 -->
          <header class="header">
            <button data-action="back" class="btn-back">
              <img src="images/detail_btn_back.svg" alt="뒤로가기">
            </button>
            <div class="header-title">5월 8일의 항로</div>
            <!-- 점3개 메뉴 -->
            <div class="menu-wrap">
              <button class="btn-menu" id="btn-menu">
                <img src="images/feedback_btn_chat.svg" alt="메뉴">
              </button>
              <div class="menu-popover" id="menuPopover">
                <button class="menu-popover-btn" id="menuPopoverBtn">편집</button>
              </div>
            </div>
          </header>

          <!-- 컨텐츠 -->
          <div class="contents">

            <h1 class="section-title">오늘의 미션</h1>

            <!-- 카드: 동영상 강의 -->
            <div class="card-video" id="card-0">
              <button class="btn-trash" data-card-id="card-0" aria-label="삭제">
                <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M2.25 4.5h13.5M6 4.5V3h6v1.5M7.5 8.25v5.25M10.5 8.25v5.25M3.75 4.5l.75 10.5h9l.75-10.5" stroke="#E53E3E" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </button>
              <div class="video-box">
                <img src="images/daily_thumbnail.png" alt="썸네일" class="thumbnail">
                <img src="images/daily_play_btn.svg" alt="재생" class="play-btn">
              </div>
              <div class="bottom-box">
                <div class="card-text">
                  <div class="card-title-row">
                    <span class="badge badge--gold">[인강]</span>
                    <span class="card-title">피그마 오토레이아웃 기초</span>
                  </div>
                  <span class="card-sub">23분 소요</span>
                </div>
                <button class="card-btn">강의 들으러 가기</button>
              </div>
            </div>

            <!-- 카드: 도서 -->
            <div class="card-book" id="card-1">
              <button class="btn-trash" data-card-id="card-1" aria-label="삭제">
                <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M2.25 4.5h13.5M6 4.5V3h6v1.5M7.5 8.25v5.25M10.5 8.25v5.25M3.75 4.5l.75 10.5h9l.75-10.5" stroke="#E53E3E" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </button>
              <div class="book-img-box">
                <img src="images/daily_book_cover.png" alt="도서 커버">
              </div>
              <div class="book-right">
                <div class="book-info">
                  <span class="badge badge--sage">[도서]</span>
                  <span class="card-title">린 스타트업 - 애시 모리아</span>
                  <span class="card-sub">p.12 ~ p.34</span>
                </div>
                <div class="book-btn-box">
                  <button class="card-btn card-btn--sm">이어보기</button>
                </div>
              </div>
            </div>

            <!-- 카드: 프로젝트 -->
            <div class="card-project" id="card-2">
              <button class="btn-trash" data-card-id="card-2" aria-label="삭제">
                <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M2.25 4.5h13.5M6 4.5V3h6v1.5M7.5 8.25v5.25M10.5 8.25v5.25M3.75 4.5l.75 10.5h9l.75-10.5" stroke="#E53E3E" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </button>
              <div class="project-text">
                <div class="project-title-box">
                  <span class="badge badge--orange">[프로젝트]</span>
                  <span class="card-title">포트폴리오 리뉴얼</span>
                </div>
                <div class="project-list">
                  <div class="list-item">
                    <img src="images/daily_check_done.svg" alt="완료" class="check-icon">
                    <span class="list-text">앱 기획하기</span>
                  </div>
                  <div class="list-item">
                    <img src="images/daily_check_done.svg" alt="완료" class="check-icon">
                    <span class="list-text">와이어프레임 뼈대 구축</span>
                  </div>
                  <div class="list-item">
                    <img src="images/daily_check_todo.svg" alt="미완료" class="check-icon">
                    <span class="list-text list-text--todo">브랜딩 컬러 도출</span>
                  </div>
                </div>
              </div>
              <button class="card-btn">작업 시작하기</button>
            </div>

          </div>
        </main>
      </div>
    </div>

    <!-- 삭제 확인 모달 -->
    <div class="modal-overlay" id="deleteModal">
      <div class="modal-card">
        <p class="modal-title">삭제하시겠습니까?</p>
        <div class="modal-btns">
          <button class="modal-btn modal-btn--gray">취소</button>
          <button class="modal-btn modal-btn--charcoal">확인</button>
        </div>
      </div>
    </div>

    <div id="nav-root"></div>
  </div>

  <script src="daily_mission.js"></script>
  <script src="common.js"></script>
</body>
</html>
