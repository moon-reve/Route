<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Route</title>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="pre_step.css">
  <link rel="stylesheet" href="pre_step2.css">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Route">
  <link rel="icon" href="images/home_logo_icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#F9F9F9">
</head>
<body>
  <div class="screen">

    <!-- 배경 이미지 -->
    <img src="images/pre_bg.svg" alt="" class="pre-bg">

    <!-- 페이지 래퍼 -->
    <div class="pre-wrap">

      <!-- 메인 -->
      <div class="pre-main">

        <!-- 헤더 -->
        <header class="pre-header">
          <button data-href="pre_step1" class="btn-back">
            <img src="images/pre_header.svg" alt="뒤로가기" class="btn-back-img">
          </button>
        </header>

        <!-- 콘텐츠 -->
        <div class="pre-contents">

          <!-- 상단: 프로그레스 + 질문 -->
          <div class="pre-top">

            <!-- 프로그레스바 -->
            <div class="progressbar">
              <span class="step-label">STEP 02 / 05</span>
              <div class="progress-track">
                <div class="progress-fill" style="width: 40%"></div>
              </div>
            </div>

            <!-- 질문 카드 -->
            <div class="question-card">
              <p class="question-title">능숙하게 다룰 수 있는 디자인 툴을 선택해주세요.</p>
              <p class="question-sub">선택하신 툴 숙련도에 따라 실습 과제의 난이도와 비중이 맞춤 조정됩니다.</p>
            </div>

          </div>

          <!-- 툴 그리드 -->
          <div class="tool-grid">

            <!-- Row 1 -->
            <div class="tool-row">
              <div class="tool-card">
                <div class="tool-icon-wrap">
                  <img src="images/tool_figma.png" alt="Figma" class="tool-icon">
                </div>
                <span class="tool-name">Figma</span>
              </div>
              <div class="tool-card">
                <div class="tool-icon-wrap">
                  <img src="images/tool_adobexd-6f07c2.png" alt="Adobe XD" class="tool-icon">
                </div>
                <span class="tool-name">Adobe XD</span>
              </div>
            </div>

            <!-- Row 2 -->
            <div class="tool-row">
              <div class="tool-card">
                <div class="tool-icon-wrap">
                  <img src="images/tool_photoshop.png" alt="Photoshop" class="tool-icon">
                </div>
                <span class="tool-name">Photoshop</span>
              </div>
              <div class="tool-card">
                <div class="tool-icon-wrap">
                  <img src="images/tool_illustrator.png" alt="Illustrator" class="tool-icon">
                </div>
                <span class="tool-name">Illustrator</span>
              </div>
            </div>

            <!-- Row 3 -->
            <div class="tool-row">
              <div class="tool-card">
                <div class="tool-icon-wrap tool-icon-wrap--dark">
                  <img src="images/tool_midjourney.png" alt="Midjourney" class="tool-icon">
                </div>
                <span class="tool-name">Midjourney</span>
              </div>
              <div class="tool-card">
                <div class="tool-icon-wrap tool-icon-wrap--dark">
                  <img src="images/tool_claude.png" alt="Claude" class="tool-icon">
                </div>
                <span class="tool-name">Claude</span>
              </div>
            </div>

          </div><!-- /tool-grid -->

        </div><!-- /pre-contents -->
      </div><!-- /pre-main -->

      <!-- 다음 버튼 -->
      <button data-href="pre_step3" class="btn-next">
        <span class="btn-next-text">다음으로</span>
        <img src="images/pre_btn_next.svg" alt="" class="btn-next-icon">
      </button>

    </div><!-- /pre-wrap -->
  </div>

  <script src="pre_steps.js"></script>
  <script src="common.js"></script>
</body>
</html>
