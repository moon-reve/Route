<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Route — 새로운 항로 등록</title>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
  <link rel="stylesheet" href="log_write.css">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Route">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#F9F9F9">
</head>
<body>

  <div class="screen">
    <div class="scroll-area">
      <div class="log-container">

        <!-- 헤더 -->
        <header class="log-header">
          <div class="log-title">새로운 항로 등록</div>
          <button class="log-close" onclick="history.back()">
            <img src="images/log_btn_close.svg" alt="닫기">
          </button>
        </header>

        <!-- 컨텐츠 -->
        <div class="log-contents">

          <!-- 히어로 썸네일 -->
          <div class="hero-section">
            <div class="hero-illustration">
              <img src="images/log_hero_img.svg" alt="">
            </div>
            <p class="hero-caption">링크를 입력하면 썸네일이 자동으로 채워져요</p>
          </div>

          <!-- 항로 유형 선택 -->
          <div class="section-resource">
            <div class="section-label">어떤 형태의 항로인가요?</div>
            <div class="resource-tabs">
              <div class="resource-tab resource-tab--active">인강/강의</div>
              <div class="resource-tab">도서/아티클</div>
              <div class="resource-tab">프로젝트</div>
            </div>
          </div>

          <!-- 기본 정보 입력 -->
          <div class="section-inputs">
            <div class="input-group">
              <label class="input-label">학습할 링크 (선택)</label>
              <div class="input-box">
                <input type="url" placeholder="URL을 붙여넣으면 제목이 자동 입력돼요">
              </div>
            </div>
            <div class="input-group">
              <label class="input-label">항로 이름 (필수)</label>
              <div class="input-box">
                <input type="text" placeholder="예) 피그마 오토레이아웃 마스터 클래스">
              </div>
            </div>
          </div>

          <!-- 기간 설정 -->
          <div class="section-duration">
            <div class="section-label">목표 기간을 설정해 주세요</div>
            <div class="date-row">
              <div class="date-box">
                <span class="date-text">2026. 05. 08</span>
                <img src="images/log_calendar.svg" alt="" class="calendar-icon">
              </div>
              <span class="date-sep">~</span>
              <div class="date-box">
                <span class="date-text date-placeholder">종료일 선택</span>
                <img src="images/log_calendar.svg" alt="" class="calendar-icon">
              </div>
            </div>
          </div>

          <!-- 리마인더 -->
          <div class="section-reminder">
            <span class="reminder-text">매일 지정된 시간에 리마인드 받기</span>
            <img src="images/log_toggle.svg" alt="토글" class="toggle-btn">
          </div>

          <!-- 제출 버튼 -->
          <button class="submit-btn">계획 추가하기</button>

        </div>
      </div>
    </div>
  </div>

</body>
</html>
