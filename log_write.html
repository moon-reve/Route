<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Route</title>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="log_write.css">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Route">
  <link rel="icon" href="images/home_logo_icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#F9F9F9">
</head>
<body>

  <!-- 숨김 파일 인풋 (히어로 이미지) -->
  <input type="file" id="hero-file-input" accept="image/*" class="is-hidden">
  <!-- 숨김 파일 인풋 (프로젝트 파일) -->
  <input type="file" id="project-file-input" class="is-hidden">

  <div class="screen">
    <div class="scroll-area">
      <div class="log-container">

        <!-- 헤더 -->
        <header class="log-header">
          <div class="log-title">새로운 항로 등록</div>
          <button class="log-close" data-action="back">
            <img src="images/log_btn_close.svg" alt="닫기">
          </button>
        </header>

        <!-- 컨텐츠 -->
        <div class="log-contents">

          <!-- 히어로 썸네일 -->
          <div class="hero-section">
            <div class="hero-illustration">
              <img src="images/log_hero_img.svg" alt="" id="hero-img">
              <div class="hero-upload-overlay">
                <span class="hero-upload-label">사진 변경</span>
              </div>
              <span class="hero-caption" id="hero-caption">탭하여 오늘의 항해 순간을 담아보세요</span>
            </div>
          </div>

          <!-- 항로 유형 선택 -->
          <div class="section-resource">
            <div class="section-label">어떤 형태의 항로인가요?</div>
            <div class="resource-tabs">
              <div class="resource-tab resource-tab--active">로그</div>
              <div class="resource-tab">인강/강의</div>
              <div class="resource-tab">도서/아티클</div>
              <div class="resource-tab">프로젝트</div>
            </div>
          </div>

          <!-- 날짜 선택 (로그 탭) -->
          <div class="section-log-date" id="section-log-date">
            <div class="section-label">날짜</div>
            <div class="date-box date-box--full">
              <span class="date-text" id="log-date-text"></span>
              <img src="images/log_calendar.svg" alt="" class="calendar-icon">
            </div>
          </div>

          <!-- 기본 정보 입력 -->
          <div class="section-inputs">
            <div class="input-group" id="link-group">
              <label class="input-label" id="link-label">학습할 링크 (선택)</label>
              <div class="input-box">
                <input type="url" id="link-input" placeholder="URL을 붙여넣으면 제목이 자동 입력돼요">
              </div>
            </div>
            <!-- 프로젝트 파일 업로드 (선택) -->
            <div class="input-group" id="file-upload-group">
              <label class="input-label">파일 업로드 (선택)</label>
              <div class="input-box input-box--file">
                <span class="file-name-text" id="file-name-text">파일을 선택해주세요</span>
                <img src="images/log_calendar.svg" alt="" class="file-icon">
              </div>
            </div>
            <div class="input-group">
              <label class="input-label" id="title-label">제목 (필수)</label>
              <div class="input-box">
                <input type="text" id="title-input" placeholder="오늘은 어떤 기록을 해볼까요">
              </div>
            </div>
          </div>

          <!-- 설명 입력 -->
          <div class="section-inputs">
            <div class="input-group">
              <label class="input-label">간단한 설명 (선택)</label>
              <div class="input-box input-box--textarea">
                <textarea id="desc-input" placeholder="왜 이렇게 했는지, 무엇을 느꼈는지 — 나중에 면접 준비할 때 가장 도움이 될 기록이에요" rows="3"></textarea>
              </div>
            </div>
          </div>

          <!-- 기간 설정 -->
          <div class="section-duration" id="section-duration">
            <div class="section-label">목표 기간을 설정해 주세요</div>
            <div class="date-row">
              <div class="date-box">
                <span class="date-text date-placeholder" id="start-date-text">시작일 선택</span>
                <img src="images/log_calendar.svg" alt="" class="calendar-icon">
              </div>
              <span class="date-sep">~</span>
              <div class="date-box">
                <span class="date-text date-placeholder" id="end-date-text">종료일 선택</span>
                <img src="images/log_calendar.svg" alt="" class="calendar-icon">
              </div>
            </div>
          </div>

          <!-- 리마인더 -->
          <div class="section-reminder" id="section-reminder" data-active="true">
            <div class="reminder-row">
              <span class="reminder-text">매일 지정된 시간에 리마인드 받기</span>
              <div class="toggle-switch"></div>
            </div>
            <div class="reminder-time-row">
              <span class="reminder-time-label">알림 시간</span>
              <span class="reminder-time-display" id="reminder-time-display">오전 9:00</span>
            </div>
          </div>

          <!-- 제출 버튼 -->
          <button class="submit-btn" data-href="log_calendar">계획 추가하기</button>

        </div>
      </div>
    </div>
  </div>

  <!-- 시간 선택 팝업 (드럼 피커) -->
  <div id="time-popup">
    <div class="drum-wrapper">
      <div class="drum-fade-top"></div>
      <div class="drum-fade-bottom"></div>
      <div class="drum-line drum-line--top"><span></span><span></span><span></span></div>
      <div class="drum-line drum-line--bottom"><span></span><span></span><span></span></div>
      <div class="drum-col" id="drum-ampm"></div>
      <div class="drum-col" id="drum-hour"></div>
      <div class="drum-col" id="drum-min"></div>
    </div>
    <button class="time-confirm-btn">확인</button>
  </div>

  <!-- 캘린더 팝업 -->
  <div id="cal-popup">
    <div class="cal-header">
      <button class="cal-nav">&#8249;</button>
      <span class="cal-title" id="cal-title"></span>
      <button class="cal-nav">&#8250;</button>
    </div>
    <div class="cal-days">
      <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
    </div>
    <div class="cal-grid" id="cal-grid"></div>
  </div>

  <script src="log_write.js"></script>
  <script src="common.js"></script>
</body>
</html>
